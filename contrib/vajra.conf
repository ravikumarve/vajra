# VAJRA Configuration
# Path: ~/.vajra/config.yaml

listen:
  sse: ":9735"               # HTTP SSE endpoint
  stdio: true                # Enable stdio transport

storage:
  audit_db: "~/.vajra/audit.db"
  audit_rotate_mb: 100

identity:
  # OAuth providers for agent identity
  oauth_providers: []
  # mTLS certificate authority for headless agents
  mtls_ca: ""

policies:
  dir: "~/.vajra/policies/"
  default_ttl: "5s"

ring_buffer:
  capacity: 10000
  sweep_interval: "1s"
